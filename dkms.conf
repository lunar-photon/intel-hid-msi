PACKAGE_NAME="intel-hid-msi"
PACKAGE_VERSION="1.0"
# intel-hid with a fix for MSI EC firmware that sends only the power button
# release (0xcf) on a short tap. Replaces the in-tree intel-hid module.
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
BUILT_MODULE_NAME[0]="intel-hid"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86/intel"
AUTOINSTALL="yes"
